name: Validación del minisumo
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-
      - run: python -m pip install platformio==6.2.0
      - name: Pruebas nativas y de Python
        run: scripts/correr.sh tests
      - name: Compilar los cuatro entornos y verificar Flash
        run: scripts/correr.sh compilar
      - name: Simulador y batería corta
        run: scripts/correr.sh simular
      - name: Regresión de Rumania por casilla
        run: |
          python3 simulacion/bateria.py --rumania --muestras 3000 --json /tmp/ref_despues.json
          python3 scripts/verificar_invariantes.py --antes simulacion/resultados/refactor_referencia.json --despues /tmp/ref_despues.json
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: LLVM y enlazador WebAssembly
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: npm --prefix web test
      - uses: actions/upload-artifact@v4
        with:
          name: simulador-web
          path: web/dist
