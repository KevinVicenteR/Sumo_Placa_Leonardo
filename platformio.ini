; Robot de minisumo para Rumania (RoboChallenge) — solo el firmware de combate.
; Cargar al robot: pio run -t upload
[platformio]
default_envs = leonardo
src_dir = firmware/src
include_dir = firmware/include

[env:leonardo]
platform = atmelavr@5.3.0
board = leonardo
framework = arduino
; Deduplica prólogos y relaja saltos AVR sin cambiar la lógica de los modos.
build_flags = -mcall-prologues -Wl,--relax -fno-split-wide-types -fno-move-loop-invariants -fno-tree-scev-cprop -fno-jump-tables
