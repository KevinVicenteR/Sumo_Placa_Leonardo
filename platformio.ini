[platformio]
default_envs = leonardo

[env:leonardo]
platform = atmelavr
board = leonardo
framework = arduino

[env:diagnostico]
platform = atmelavr
board = leonardo
framework = arduino
build_flags = -DMODO_DIAGNOSTICO
monitor_speed = 115200

[env:monitoreo]
platform = atmelavr
board = leonardo
framework = arduino
build_flags = -DMONITOREO_COMBATE
monitor_speed = 115200

[env:prueba_motores]
platform = atmelavr
board = leonardo
framework = arduino
build_flags = -DMODO_PRUEBA_MOTORES
monitor_speed = 115200

[env:native]
platform = native
test_framework = unity
test_build_src = true
build_flags =
	-I test/support
build_src_filter =
	-<*>
	+<EstrategiaCombate.cpp>
	+<ControlMovimiento.cpp>
	+<EstimadorBorde.cpp>
	+<ControladorRobot.cpp>
	+<Percepcion.cpp>
	+<../test/support/arduino_stubs.cpp>
