; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Sin esto, "Upload" sube todos los entornos y el último (diagnostico) deja
; los motores apagados. Para diagnosticar: pio run -e diagnostico -t upload
[platformio]
default_envs = leonardo

[env:leonardo]
platform = atmelavr
board = leonardo
framework = arduino

[env:diagnostico]
platform = atmelavr
board = leonardo
framework = arduino
build_flags = -DMODO_DIAGNOSTICO
monitor_speed = 115200

[env:native]
platform = native
test_framework = unity
test_build_src = true
build_flags =
	-I test/support
build_src_filter =
	-<*>
	+<EstrategiaCombate.cpp>
	+<ControlMovimiento.cpp>
	+<ControladorRobot.cpp>
	+<../test/support/arduino_stubs.cpp>
